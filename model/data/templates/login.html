<!DOCTYPE html>
<html>
<head>
    <title>Network Security Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Network Security</h1>

        <p>Real-Time Attack Detection System</p>

        <form action="/authenticate" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <div class="demo">
            Demo: admin / admin123
        </div>

    </div>

</div>

</body>
</html>
