<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECURENET - Dashboard</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<header>

    <div class="brand">

        <h2>SECURENET</h2>

    </div>


    <nav>

        <a
            href="/dashboard"
            class="active"
        >
            Dashboard
        </a>

        <a href="/monitoring">
            Monitoring
        </a>

        <a href="/logs">
            Logs
        </a>

        <a href="/logout">
            Logout
        </a>

    </nav>

</header>



<main>


    <!-- STATISTICS -->

    <section class="stats">


        <div class="stat-card blue">

            <p>TOTAL EVENTS</p>

            <h1 id="total">
                0
            </h1>

        </div>



        <div class="stat-card red">

            <p>DETECTED ATTACKS</p>

            <h1 id="attacks">
                0
            </h1>

        </div>



        <div class="stat-card green">

            <p>SAFE TRAFFIC</p>

            <h1 id="safe">
                0
            </h1>

        </div>



        <div class="stat-card purple">

            <p>SYSTEM STATUS</p>

            <h1 id="system">
                ONLINE
            </h1>

        </div>


    </section>



    <!-- RECENT EVENTS -->

    <section class="events-card">


        <div class="section-title">

            <h2>
                Recent Network Events
            </h2>

            <span id="liveIndicator">
                ● LIVE
            </span>

        </div>



        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            SOURCE IP
                        </th>

                        <th>
                            DESTINATION
                        </th>

                        <th>
                            PROTOCOL
                        </th>

                        <th>
                            ATTACK TYPE
                        </th>

                        <th>
                            RISK
                        </th>

                        <th>
                            STATUS
                        </th>

                        <th>
                            TIMESTAMP
                        </th>

                    </tr>

                </thead>



                <tbody id="recentEvents">

                    <tr>

                        <td colspan="7">

                            Loading network events...

                        </td>

                    </tr>

                </tbody>


            </table>

        </div>


    </section>



</main>



<script src="/static/js/dashboard.js"></script>


</body>

</html>
