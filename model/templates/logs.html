<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs | Network Attack Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <nav class="topbar">
        <div class="brand">SecureNet</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('monitoring') }}">Monitoring</a>
            <a class="active" href="{{ url_for('logs_page') }}">Logs</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="page">
        <section class="panel">
            <div class="panel-header">
                <h2>Network Activity Logs</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Protocol</th>
                        <th>Packets</th>
                        <th>Size</th>
                        <th>Rate</th>
                        <th>Type</th>
                        <th>Risk</th>
                        <th>Status</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="logsTable"></tbody>
            </table>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/logs.js') }}"></script>
</body>
</html>
